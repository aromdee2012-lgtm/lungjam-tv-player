<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บแอปดูทีวีออนไลน์ - ฝึกภาษา & ทั่วโลก</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: #0f172a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2563eb;
    }

    header h1 {
      font-size: 1.2rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span {
      color: #2563eb;
      font-size: 0.9rem;
      background: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Layout Main */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Video Section */
    .video-section {
      flex: 1;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      max-height: calc(100vh - 120px);
      background-color: #000000;
      outline: none;
    }

    .channel-title-bar {
      width: 100%;
      padding: 10px 20px;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      border-top: 1px solid #1e293b;
    }

    /* Playlist Sidebar */
    .sidebar {
      width: 360px;
      background-color: #0f172a;
      border-left: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
    }

    .filter-box {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input, .category-select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #ffffff;
      font-size: 0.9rem;
    }

    .search-input:focus, .category-select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-item {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.2s;
    }

    .channel-item:hover {
      background-color: #1e293b;
    }

    .channel-item.active {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: bold;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #334155;
      color: #94a3b8;
    }

    .channel-item.active .badge {
      background-color: #1e40af;
      color: #ffffff;
    }

    /* Footer / Status */
    footer {
      background-color: #0f172a;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
      text-align: center;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 45vh;
      }
      video {
        max-height: 35vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1><span>LIVE</span> แอปดูทีวี (ไทย & เอเชีย & ทั่วโลก)</h1>
  </header>

  <div class="main-container">
    <!-- หน้าจอเล่นวิดีโอ -->
    <div class="video-section">
      <video id="video" controls autoplay muted></video>
      <div class="channel-title-bar" id="currentChannelName">เลือกช่องรายการเพื่อรับชม</div>
    </div>

    <!-- รายการช่อง (Sidebar) -->
    <div class="sidebar">
      <div class="filter-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อช่อง/ภาษา..." oninput="filterChannels()">
        <select id="categorySelect" class="category-select" onchange="filterChannels()">
          <option value="ALL">ทุกหมวดหมู่ (36 ช่อง)</option>
          <option value="ทีวีไทย">ทีวีไทยดิจิทัล</option>
          <option value="ญี่ปุ่น">🇯🇵 ญี่ปุ่น (Japan)</option>
          <option value="เกาหลี">🇰🇷 เกาหลีใต้ (Korea)</option>
          <option value="ไต้หวัน">🇹🇼 ไต้หวัน (Taiwan)</option>
          <option value="จีน">🇨🇳 จีน (China)</option>
          <option value="ข่าวต่างประเทศสากล">🌍 ข่าวต่างประเทศสากล</option>
          <option value="สารคดี/บันเทิง">🎬 สารคดี & บันเทิง</option>
        </select>
      </div>
      <ul class="channel-list" id="channelList"></ul>
    </div>
  </div>

  <footer>
    สร้างสรรค์ด้วย HTML5 & HLS.js — พร้อมใช้งาน
  </footer>

  <script>

      { id: 2, name: "ช่อง 3 HD (33)", category: "ทีวีไทย", url: "https://ch3-33-web.cdn.byteark.com/live/playlist_720p/index.m3u8" },
      { id: 3, name: "ช่อง 7 HD", category: "ทีวีไทย", url: "http://live-cdn.ch7.com/out/v1/eafeb02c55b64a15b278b1e66c7fc776/playlist_9.m3u8" },
      { id: 4, name: "ช่องวัน 31 (One 31)", category: "ทีวีไทย", url: "https://bcovlive-a.akamaihd.net/b6603a14ea59440a95e9235e14bc9332/ap-southeast-1/6415628290001/9c3d7fc7d10840a69e48b5939ae886e0/playlist_ssaiM.m3u8" },
      { id: 5, name: "โมโน 29 (Mono 29)", category: "ทีวีไทย", url: "https://monomax-uiripn.cdn.byteark.com/plain/th/1080p/index.m3u8" },
      { id: 6, name: "เนชั่นทีวี (Nation TV 22)", category: "ทีวีไทย", url: "https://nationtv-1jdcjo.cdn.byteark.com/fleetstream/nationtvlive/index.m3u8" },
      { id: 7, name: "ช่อง 9 MCOT HD", category: "ทีวีไทย", url: "https://mcothd-streaming-edge-cdn.mcot.net/tencentmcot/smil:tencentmcot.smil/playlist.m3u8" },
      { id: 8, name: "ท็อปนิวส์ (Top News)", category: "ทีวีไทย", url: "https://live.topnews.co.th/hls/topnews_a_720.m3u8" },

      // --- หมวดญี่ปุ่น (Japanese) ---
      { id: 9, name: "NHK World Japan (ข่าวภาษาอังกฤษ/ญี่ปุ่น)", category: "ญี่ปุ่น", url: "https://nhkworld.akamaized.net/hls/live/2003459/nhkworld/master_1080.m3u8" },
      { id: 10, name: "Live Camera Japan (วิวสดญี่ปุ่น)", category: "ญี่ปุ่น", url: "https://cph-p2p-ms.akamaized.net/hls/live/2000341/test/master.m3u8" }, // ตัวอย่างสตรีมสาธารณะญี่ปุ่น

      // --- หมวดเกาหลีใต้ (Korean) ---
      { id: 11, name: "Arirang TV (อารีดัง - ข่าวเกาหลี/อังกฤษ)", category: "เกาหลี", url: "https://amglive-ch01-ct.skynoc.com/arirang_1ch/playlist.m3u8" },
      { id: 12, name: "Yonhap News TV (YTN เกาหลี)", category: "เกาหลี", url: "https://live.yhtv.co.kr/yhtv-live/playlist.m3u8" },

      // --- หมวดไต้หวัน (Taiwan) ---
      { id: 13, name: "FTV News (ข่าวไต้หวัน ภาษาจีน)", category: "ไต้หวัน", url: "https://stream.ftv.com.tw/live/ftv1.smil/playlist.m3u8" },
      { id: 14, name: "CTS News (ข่าวทีวีไต้หวัน)", category: "ไต้หวัน", url: "https://live.cts.com.tw/live/playlist.m3u8" },
      { id: 15, name: "TTV News (台視新聞 - ไต้หวัน)", category: "ไต้หวัน", url: "https://video.ttv.com.tw/live/tv01.smil/playlist.m3u8" },

      // --- หมวดจีน (China) ---
      { id: 16, name: "CGTN News (ข่าวจีนสากล ภาคภาษาอังกฤษ/จีน)", category: "จีน", url: "https://news.cgtn.com/resource/live/english.m3u8" },
      { id: 17, name: "CGTN Documentary (สารคดีจีน)", category: "จีน", url: "https://news.cgtn.com/resource/live/doc.m3u8" },

      // --- หมวดข่าวต่างประเทศสากล ---
      { id: 18, name: "DW News (เยอรมนี - อังกฤษ)", category: "ข่าวต่างประเทศสากล", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { id: 19, name: "France 24 English (ฝรั่งเศส)", category: "ข่าวต่างประเทศสากล", url: "https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8" },
      { id: 20, name: "Al Jazeera English (กาตาร์)", category: "ข่าวต่างประเทศสากล", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: 21, name: "TRT World (ตุรกี)", category: "ข่าวต่างประเทศสากล", url: "https://tv-trtworld.medya.trt.com.tr/master.m3u8" },
      { id: 22, name: "CNA Channel NewsAsia (สิงคโปร์)", category: "ข่าวต่างประเทศสากล", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f42aeb4a48142d22a6111/index.m3u8" },
      { id: 23, name: "ABC News Australia (ออสเตรเลีย)", category: "ข่าวต่างประเทศสากล", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: 24, name: "Euronews (ยุโรป)", category: "ข่าวต่างประเทศสากล", url: "https://euronews-euronews-1-eu.rakuten.wurl.tv/playlist.m3u8" },
      { id: 25, name: "Sky News (สหราชอาณาจักร)", category: "ข่าวต่างประเทศสากล", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },

      // --- หมวดสารคดี / บันเทิง / กีฬา ---
      { id: 26, name: "NASA TV Public (อวกาศ - สหรัฐฯ)", category: "สารคดี/บันเทิง", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-TV-Public/master.m3u8" },
      { id: 27, name: "Boomerang Thailand (การ์ตูน)", category: "สารคดี/บันเทิง", url: "https://lb1-live-mv.v2h-cdn.com/hls/fffa/boomerang/boomerang.m3u8" },
      { id: 28, name: "Red Bull TV (กีฬาเอ็กซ์ตรีม)", category: "สารคดี/บันเทิง", url: "https://rbmn-live.akamaized.net/hls/live/590920/GEO_RESTRICTED/master.m3u8" },
      { id: 29, name: "Fashion TV (แฟชั่นสากล)", category: "สารคดี/บันเทิง", url: "https://fash10803.ftvchannel.com/hls2/ftv_ftv_mid_main/index.m3u8" },
      { id: 30, name: "Rama Channel (ศิริราช/มหิดล)", category: "สารคดี/บันเทิง", url: "https://ramach.ddns.net/live/ramalive/index.m3u8" },
      { id: 31, name: "STOU Channel (มสธ. ความรู้)", category: "สารคดี/บันเทิง", url: "https://stream1.stou.ac.th/live/stou_720p/playlist.m3u8" },
      { id: 32, name: "Bloomberg TV (การเงิน/หุ้น สหรัฐฯ)", category: "สารคดี/บันเทิง", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: 33, name: "Wochit Entertainment (บันเทิงสากล)", category: "สารคดี/บันเทิง", url: "https://business-view-samsung.amagi.tv/playlist.m3u8" },
      { id: 34, name: "Law & Crime Trial Network (คดีศาล)", category: "สารคดี/บันเทิง", url: "https://lawandcrime.amagi.tv/playlist.m3u8" },
      { id: 35, name: "People TV (สารคดีชีวิต)", category: "สารคดี/บันเทิง", url: "https://peopletv-samsung.amagi.tv/playlist.m3u8" },
      { id: 36, name: "Travelxp (ท่องเที่ยวรอบโลก)", category: "สารคดี/บันเทิง", url: "https://travelxp-samsung.amagi.tv/playlist.m3u8" }
    ];

    const video = document.getElementById('video');
    const channelListEl = document.getElementById('channelList');
    const currentChannelNameEl = document.getElementById('currentChannelName');
    let hls = null;
    let currentChannelId = null;

    // เล่นไฟล์ .m3u8
    function playChannel(channel) {
      currentChannelId = channel.id;
      currentChannelNameEl.textContent = `กำลังรับชม: ${channel.name}`;

      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(() => {
            console.log("Autoplay ถูกบล็อก คลิกที่หน้าจอเพื่อเล่น");
          });
        });
      } 
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      } else {
        alert("เบราว์เซอร์ของคุณไม่รองรับการเล่น HLS");
      }

      renderChannels();
    }

    // แสดงรายการช่อง
    function renderChannels() {
      const listToRender = getFilteredData();
      channelListEl.innerHTML = '';

      if (listToRender.length === 0) {
        channelListEl.innerHTML = '<li style="padding:16px; text-align:center; color:#64748b;">ไม่พบช่องรายการ</li>';
        return;
      }

      listToRender.forEach(ch => {
        const li = document.createElement('li');
        li.className = `channel-item ${ch.id === currentChannelId ? 'active' : ''}`;
        li.innerHTML = `
          <span>${ch.name}</span>
          <span class="badge">${ch.category}</span>
        `;
        li.onclick = () => playChannel(ch);
        channelListEl.appendChild(li);
      });
    }

    // กรองช่องค้นหา/หมวดหมู่
    function getFilteredData() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categorySelect').value;

      return channels.filter(ch => {
        const matchSearch = ch.name.toLowerCase().includes(searchText) || ch.category.toLowerCase().includes(searchText);
        const matchCategory = selectedCategory === 'ALL' || ch.category === selectedCategory;
        return matchSearch && matchCategory;
      });
    }

    function filterChannels() {
      renderChannels();
    }

    // เริ่มต้นแสดงผลและเปิดช่องแรกทันที
    window.addEventListener('DOMContentLoaded', () => {
      renderChannels();
      if (channels.length > 0) {
        playChannel(channels[0]);
      }
    });
  </script>
</body>
</html>
